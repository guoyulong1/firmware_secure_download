name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-self-test:
    # 目标架构是 ARM64（地平线X3），用 GitHub 原生 ARM64 runner 做与真机一致的门禁。
    # 若账号没有 ubuntu-24.04-arm，改成 ubuntu-latest（x86_64）仍能校验编译与
    # --self-test 逻辑，只是不再代表目标架构。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 缓存第三方源码（OpenSSL/curl/googletest）
        uses: actions/cache@v4
        with:
          path: |
            3rdparty/openssl
            3rdparty/curl
            3rdparty/googletest
          key: 3rdparty-${{ hashFiles('3rdparty/fetch.sh') }}

      - name: 拉取第三方源码（缓存未命中时）
        run: ./3rdparty/fetch.sh

      - name: 配置并构建
        run: |
          cmake -S . -B build
          cmake --build build

      - name: 本地自检
        run: ./build/firmware_secure_download --self-test

      - name: 单元测试（ctest + GoogleTest）
        run: ctest --test-dir build --output-on-failure
